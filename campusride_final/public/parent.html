<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CampusRide Parent App — Student Tracking & Safety Radar</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- jsQR Fallback Decoder -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- CampusRide Design System -->
  <link rel="stylesheet" href="/css/app.css" />

  <!-- Hard Role Lock: Pure Parent App Only -->
  <script>
    window.CAMPUSRIDE_LOCKED_ROLE = 'parent';
    localStorage.setItem('campusride_app_role', 'parent');
  </script>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Floating Gradient Orbs Background -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Main SPA Container -->
  <div id="app" class="relative z-10 min-h-screen flex flex-col">
    <div class="min-h-screen flex flex-col items-center justify-center space-y-4">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-xl shadow-indigo-500/25 animate-bounce text-3xl">
        👨‍👩‍👧
      </div>
      <div class="font-bold text-sm text-slate-500 dark:text-slate-400">Loading CampusRide Parent App...</div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/sounds.js?v=3.3"></script>
  <script src="/js/i18n.js?v=3.3"></script>
  <script src="/js/api.js?v=3.3"></script>
  <script src="/js/qr.js?v=3.3"></script>
  <script src="/js/components/LiveMap.js?v=3.3"></script>
  <script src="/js/components/Header.js?v=3.3"></script>
  <script src="/js/components/LanguageGate.js?v=3.3"></script>

  <script src="/js/pages/Login.js?v=3.3"></script>
  <script src="/js/pages/StaffRegister.js?v=3.3"></script>
  <script src="/js/pages/DriverRegister.js?v=3.3"></script>
  <script src="/js/pages/ParentRegister.js?v=3.3"></script>
  <script src="/js/pages/ForgotPassword.js?v=3.3"></script>
  <script src="/js/pages/AdminDashboard.js?v=3.3"></script>
  <script src="/js/pages/StaffHome.js?v=3.3"></script>
  <script src="/js/pages/EntryExitScanner.js?v=3.3"></script>
  <script src="/js/pages/RegistrationScanner.js?v=3.3"></script>
  <script src="/js/pages/VanRegister.js?v=3.3"></script>
  <script src="/js/pages/DriversRegistry.js?v=3.3"></script>
  <script src="/js/pages/DriverHome.js?v=3.3"></script>
  <script src="/js/pages/ParentHome.js?v=3.3"></script>
  <script src="/js/pages/LiveMapPage.js?v=3.3"></script>
  <script src="/js/pages/Directories.js?v=3.3"></script>
  <script src="/js/pages/Settings.js?v=3.3"></script>

  <script src="/js/app.js?v=3.3"></script>
</body>
</html>
