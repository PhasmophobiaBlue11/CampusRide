<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Wheels (behind body) -->
  <rect x="14" y="46" width="9" height="7" rx="2.5" fill="#090d16"/>
  <rect x="41" y="46" width="9" height="7" rx="2.5" fill="#090d16"/>

  <!-- Bus/Van Body (Vibrant Amber/Gold) -->
  <path d="M12 25 C12 20 16 17 22 17 L42 17 C48 17 52 20 52 25 L52 45 C52 47 50 49 48 49 L16 49 C14 49 12 47 12 45 Z" fill="url(#bus)"/>

  <!-- Roof Indicator Lights -->
  <circle cx="27" cy="18.5" r="1.2" fill="#ef4444"/>
  <circle cx="37" cy="18.5" r="1.2" fill="#ef4444"/>

  <!-- Windshield (Sleek Dark Glass) -->
  <path d="M16 22 L48 22 C49 22 50 23 49.5 24 L48 33 C47.5 34 46.5 34 45.5 34 L18.5 34 C17.5 34 16.5 34 16 33 L14.5 24 C14 23 15 22 16 22 Z" fill="#0f172a"/>
  <!-- Glare -->
  <path d="M18 24 L28 24 L23 32 L17 32 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Radiator Grille -->
  <rect x="23" y="38" width="18" height="6" rx="2" fill="#1e293b"/>
  <line x1="26" y1="40" x2="38" y2="40" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26" y1="42" x2="38" y2="42" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Headlights -->
  <circle cx="16.5" cy="41" r="3.2" fill="#ffffff"/>
  <circle cx="16.5" cy="41" r="2" fill="#fef08a"/>
  <circle cx="47.5" cy="41" r="3.2" fill="#ffffff"/>
  <circle cx="47.5" cy="41" r="2" fill="#fef08a"/>

  <!-- Front Bumper -->
  <rect x="11" y="47" width="42" height="3" rx="1.5" fill="#334155"/>
</svg>