<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CampusRide — Secure Campus Transportation Management</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- jsQR Fallback Decoder -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- CampusRide Design System -->
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">

  <!-- Ambient Floating Gradient Orbs Background (§9) -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Main SPA Container -->
  <div id="app" class="relative z-10 min-h-screen flex flex-col">
    <!-- Initial Loading Spinner -->
    <div class="min-h-screen flex flex-col items-center justify-center space-y-4">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-xl shadow-blue-500/25 animate-bounce">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6v6"></path><path d="M15 6v6"></path><path d="M2 12h19.6"></path>
          <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 7.3 19.6 7 19 7H5c-.6 0-1.1.3-1.4.8L2.2 12.8c-.1.4-.2.8-.2 1.2 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3"></path>
          <circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle>
        </svg>
      </div>
      <div class="font-bold text-sm text-slate-500 dark:text-slate-400">Loading CampusRide...</div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Scripts (Cache-Busted v3.1) -->
  <script src="/js/sounds.js?v=3.1"></script>
  <script src="/js/i18n.js?v=3.1"></script>
  <script src="/js/api.js?v=3.1"></script>
  <script src="/js/qr.js?v=3.1"></script>
  <script src="/js/components/LiveMap.js?v=3.1"></script>
  <script src="/js/components/Header.js?v=3.1"></script>
  <script src="/js/components/LanguageGate.js?v=3.1"></script>

  <script src="/js/pages/Login.js?v=3.1"></script>
  <script src="/js/pages/StaffRegister.js?v=3.1"></script>
  <script src="/js/pages/DriverRegister.js?v=3.1"></script>
  <script src="/js/pages/ParentRegister.js?v=3.1"></script>
  <script src="/js/pages/ForgotPassword.js?v=3.1"></script>
  <script src="/js/pages/AdminDashboard.js?v=3.1"></script>
  <script src="/js/pages/StaffHome.js?v=3.1"></script>
  <script src="/js/pages/EntryExitScanner.js?v=3.1"></script>
  <script src="/js/pages/RegistrationScanner.js?v=3.1"></script>
  <script src="/js/pages/VanRegister.js?v=3.1"></script>
  <script src="/js/pages/DriversRegistry.js?v=3.1"></script>
  <script src="/js/pages/DriverHome.js?v=3.1"></script>
  <script src="/js/pages/ParentHome.js?v=3.1"></script>
  <script src="/js/pages/LiveMapPage.js?v=3.1"></script>
  <script src="/js/pages/Directories.js?v=3.1"></script>
  <script src="/js/pages/Settings.js?v=3.1"></script>

  <script src="/js/app.js?v=3.1"></script>

  <!-- Auto-Purge Legacy Cache & Service Worker -->
  <script>
    if ('caches' in window) {
      caches.keys().then((names) => {
        names.forEach((name) => {
          if (name.includes('campusride-v1')) {
            caches.delete(name);
          }
        });
      });
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((r) => r.unregister());
      });
    }
  </script>
</body>
</html>
