<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CampusRide — Secure Campus Transportation Management</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- jsQR Fallback Decoder -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- CampusRide Design System -->
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">

  <!-- Ambient Floating Gradient Orbs Background (§9) -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Main SPA Container -->
  <div id="app" class="relative z-10 min-h-screen flex flex-col">
    <!-- Initial Loading Spinner with Dynamic Role Logo Detection -->
    <div id="initial-loader" class="min-h-screen flex flex-col items-center justify-center space-y-4">
      <div id="initial-loader-icon" class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-xl shadow-blue-500/25 animate-bounce">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="15" rx="3"></rect>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <circle cx="7.5" cy="19" r="2"></circle>
          <circle cx="16.5" cy="19" r="2"></circle>
        </svg>
      </div>
      <div id="initial-loader-text" class="font-bold text-sm text-slate-700 dark:text-slate-300">Loading CampusRide...</div>
    </div>
    <script>
      (function() {
        try {
          const host = window.location.hostname.toLowerCase();
          const path = window.location.pathname.toLowerCase();
          const hash = window.location.hash.toLowerCase();
          const savedRole = localStorage.getItem('campusride_app_role');
          let role = null;
          if (host.includes('driver') || path.includes('driver') || hash.includes('driver') || savedRole === 'driver') role = 'driver';
          else if (host.includes('parent') || path.includes('parent') || hash.includes('parent') || savedRole === 'parent') role = 'parent';
          else if (host.includes('staff') || path.includes('staff') || hash.includes('staff') || savedRole === 'staff') role = 'staff';
          else if (host.includes('admin') || path.includes('admin') || hash.includes('admin') || savedRole === 'admin') role = 'admin';

          const iconEl = document.getElementById('initial-loader-icon');
          const textEl = document.getElementById('initial-loader-text');
          if (iconEl && textEl && role) {
            if (role === 'driver') {
              iconEl.className = 'w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-white shadow-xl shadow-amber-500/25 animate-bounce';
              iconEl.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="15" rx="3"></rect><line x1="3" y1="10" x2="21" y2="10"></line><circle cx="7.5" cy="19" r="2"></circle><circle cx="16.5" cy="19" r="2"></circle></svg>';
              textEl.textContent = 'Loading CampusRide Driver App...';
            } else if (role === 'parent') {
              iconEl.className = 'w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-xl shadow-indigo-500/25 animate-bounce';
              iconEl.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>';
              textEl.textContent = 'Loading CampusRide Parent App...';
            } else if (role === 'staff') {
              iconEl.className = 'w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-xl shadow-blue-500/25 animate-bounce';
              iconEl.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>';
              textEl.textContent = 'Loading CampusRide Gate & Staff Desk...';
            } else if (role === 'admin') {
              iconEl.className = 'w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-700 to-indigo-700 flex items-center justify-center text-white shadow-xl shadow-purple-500/25 animate-bounce';
              iconEl.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>';
              textEl.textContent = 'Loading CampusRide Master Admin...';
            }
          }
        } catch (e) {}
      })();
    </script>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Scripts (Cache-Busted v4.1) -->
  <script src="/js/sounds.js?v=4.1"></script>
  <script src="/js/i18n.js?v=4.1"></script>
  <script src="/js/api.js?v=4.1"></script>
  <script src="/js/qr.js?v=4.1"></script>
  <script src="/js/components/Header.js?v=4.1"></script>
  <script src="/js/components/LanguageGate.js?v=4.1"></script>

  <script src="/js/pages/Login.js?v=4.1"></script>
  <script src="/js/pages/StaffRegister.js?v=4.1"></script>
  <script src="/js/pages/DriverRegister.js?v=4.1"></script>
  <script src="/js/pages/ParentRegister.js?v=4.1"></script>
  <script src="/js/pages/ForgotPassword.js?v=4.1"></script>
  <script src="/js/pages/AdminDashboard.js?v=4.1"></script>
  <script src="/js/pages/StaffHome.js?v=4.1"></script>
  <script src="/js/pages/EntryExitScanner.js?v=4.1"></script>
  <script src="/js/pages/RegistrationScanner.js?v=4.1"></script>
  <script src="/js/pages/VanRegister.js?v=4.1"></script>
  <script src="/js/pages/DriversRegistry.js?v=4.1"></script>
  <script src="/js/pages/DriverHome.js?v=4.1"></script>
  <script src="/js/pages/ParentHome.js?v=4.1"></script>
  <script src="/js/pages/Directories.js?v=4.1"></script>
  <script src="/js/pages/WorkingStaff.js?v=4.2"></script>
  <script src="/js/pages/Settings.js?v=4.1"></script>

  <script src="/js/app.js?v=4.1"></script>

    <!-- Service Worker Registration for Instant App Shell & Cold-Start Masking -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('[SW] Registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
